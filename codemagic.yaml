workflows:
  android-capacitor-release:
    name: Tuvalet Oyunlari Android AAB Build
    max_build_duration: 30
    environment:
      java: 17
      node: 20
    scripts:
      - name: Prepare web directory
        script: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/
      - name: Install dependencies
        script: |
          npm install
      - name: Add Android platform & inject AdMob App ID
        script: |
          npx cap add android
          npx cap sync android
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              txt = f.read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-8313181831885508~8594303630\"/>"
          if "com.google.android.gms.ads.APPLICATION_ID" not in txt:
              txt = txt.replace("</application>", f"    {meta}\n    </application>")
          with open(path, "w", encoding="utf-8") as f:
              f.write(txt)
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
